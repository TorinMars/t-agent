name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    # Node 20 is the oldest supported version; Node 24 is what the maintainer runs. Some behaviour differs between them (mocked timers, for example).
    name: unit (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Run only the unit and integration tests in test/. scripts/test-*-browser.cjs needs Chromium and is run manually on a local machine.
      # The files are named by a shell glob, as in `npm test`: Node 22 and later read `node --test test/` as one file named test/ and fail, and Node 20
      # also ran the helpers in test/fixtures and test/helpers as tests.
      - name: Run tests
        run: node --test test/*.test.js
