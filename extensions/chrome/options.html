<!doctype html><html lang="en"><meta charset="utf-8"><title>T-Agent Browser settings</title><link rel="stylesheet" href="ui.css"><main><h1>T-Agent Browser</h1><form id="pair"><label>Server URL<input id="server" type="url" required value="http://127.0.0.1:3000"></label><label>Browser name<input id="name" required maxlength="100"></label><label>Pairing code<input id="code" required pattern="[A-HJ-NP-Z2-9]{8}" maxlength="8" autocomplete="off"></label><button>Pair browser</button></form><p id="status" role="status"></p><p>Get a code in T-Agent Settings → Browser extension. Pairing is local to this machine.</p></main><script type="module" src="options.js"></script></html>
