<!doctype html><html lang="en"><title>Local browser fixture</title><body><main><h1>Test form</h1><form id="form"><label>Name<input id="name" name="name"></label><input id="password" type="password" value="never-export-this"><input id="secret" name="api_token" value="secret-value"><button id="save" type="button">Save</button><select id="choice"><option value="one">One</option><option value="two">Two</option></select></form><a id="next" href="/next">Next page</a><div id="output"></div><script>
const input=document.querySelector('#name');const nativeValue=Object.getOwnPropertyDescriptor(HTMLInputElement.prototype,'value');let trackedValue='';window.controlled='';Object.defineProperty(input,'value',{get(){return nativeValue.get.call(this);},set(v){trackedValue=String(v);nativeValue.set.call(this,v);}});input.addEventListener('input',e=>{if(e.target.value!==trackedValue){trackedValue=e.target.value;window.controlled=e.target.value;document.querySelector('#output').textContent=window.controlled;}});
document.querySelector('#save').addEventListener('click',()=>{fetch('/xhr?token=url-secret',{headers:{Authorization:'Bearer local-test-only','X-Api-Key':'header-secret'}}).then(r=>r.json()).then(v=>{window.response=v;console.log('request complete');});});
</script></main></body></html>
