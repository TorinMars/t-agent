<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 Client</title>
  <link rel="stylesheet" href="/css/clients.css">
</head>
<body class="frame-auth" data-client-frame="auth-required">
  <main>
    <h1>请先登录这个 Client</h1>
    <p>点击上方“打开并登录”，在新窗口完成身份验证，然后回到这里点击“刷新”。</p>
    <p>如果已登录仍显示此提示，请检查第三方 Cookie 设置及目标 Client 的内嵌配置。</p>
  </main>
  <script src="/js/client-frame.js"></script>
</body>
</html>
