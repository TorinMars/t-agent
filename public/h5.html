<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Torin's Tasks</title>
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest-h5.json">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Tasks">
  <meta name="theme-color" content="#1e1e1e">
  <!-- First paint: every script is deferred (they run in this order after the page is parsed), so the page is painted as soon as the two style sheets
       below arrive, with this inline style and the skeleton in #h5-root. The skeleton has the shell's dark background and its header bar (and the navigation rail and the sidebar edge on a wide screen) at the same place, so
       nothing jumps when the shell replaces it (React empties #h5-root on its first render). Keep the sizes in step with the shell; the load test
       (scripts/test-h5-load-browser.cjs) compares them.
       The chat's style sheet (css/agent-chat.css) is not here: js/agent-chat.js loads it with the chat bundle, when the first chat is opened.
       Scripts marked data-combine: the server (lib/static-assets.js) sends each run of them (neighbours with nothing but white space between) as one
       request, and runs them in this order, each as a script of its own. Mark only small hand-written scripts that do not read
       document.currentScript.src; h5-shell.js, h5.js, the vendor scripts and the Chinese dictionaries stay requests of their own. -->
  <style>
    html, body { margin: 0; background: #121212; color: #fff; }
    .h5-skeleton { position: fixed; inset: 0; padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left); background: #121212; }
    .h5-skeleton-header { height: 56px; box-sizing: border-box; background: #1e1e1e; border-bottom: 1px solid rgba(255, 255, 255, .12); }
    .h5-skeleton-side, .h5-skeleton-rail { display: none; }
    @media (min-width: 900px) {
      .h5-skeleton { left: 376px; }
      .h5-skeleton-header { height: 48px; }
      .h5-skeleton-rail { display: block; position: fixed; top: 0; bottom: 0; left: 0; width: 72px; box-sizing: border-box; border-right: 1px solid rgba(255, 255, 255, .12); background: #1e1e1e; }
      .h5-skeleton-side { display: block; position: fixed; top: 0; bottom: 0; left: 72px; width: 304px; box-sizing: border-box; border-right: 1px solid rgba(255, 255, 255, .12); background: #121212; }
      html[data-sidebar-collapsed] .h5-skeleton { left: 72px; }
      html[data-sidebar-collapsed] .h5-skeleton-side { display: none; }
    }
  </style>
  <link rel="stylesheet" href="/vendor/xterm/xterm-5.5.0.css">
  <link rel="stylesheet" href="/css/h5.css">
  <script defer src="/js/i18n.js" data-combine></script>
  <script defer src="/js/toast.js" data-combine></script>
  <script defer src="/js/client-auth.js" data-combine></script>
  <script defer src="/js/i18n-zh-ui.js"></script>
  <script defer src="/js/i18n-zh-server.js"></script>
  <script defer src="/js/i18n-zh-extra.js"></script>
  <script defer src="/vendor/xterm/xterm-5.5.0.js"></script>
  <script defer src="/vendor/xterm/addon-fit-0.10.0.js"></script>
  <script defer src="/vendor/xterm/addon-unicode11-0.8.0.js"></script>
</head>
<body>
  <!-- The page is drawn by the Material UI shell (scripts/h5-shell, built to js/h5-shell.js) into #h5-root, before the scripts after it run.
       The chat is a plain element that h5.js drives; the file input is inside the Upload image or file button (scripts/h5-shell/Terminal.jsx).
       The shell is an ES module (scripts/build-page-bundles.js): a module script is deferred like the others and runs in its place in this order,
       after its chunks (/js/chunks/) have arrived; the server puts a modulepreload link for each chunk before this tag (lib/static-assets.js). -->
  <div id="h5-root"><div class="h5-skeleton" aria-hidden="true"><div class="h5-skeleton-header"></div></div><div class="h5-skeleton-side" aria-hidden="true"></div><div class="h5-skeleton-rail" aria-hidden="true"></div></div>
  <div class="h5-agent" id="h5-agent" role="dialog" aria-modal="true" aria-label="Agent chat" hidden></div>
  <div id="h5-mindmap" hidden></div>

  <script type="module" src="/js/h5-shell.js"></script>
  <script defer src="/js/terminal-owner.js" data-combine></script>
  <script defer src="/js/terminal-protocol.js" data-combine></script>
  <script defer src="/js/terminal-keys.js" data-combine></script>
  <script defer src="/js/terminal-ime.js" data-combine></script>
  <script defer src="/js/terminal-translate.js" data-combine></script>
  <script defer src="/js/terminal-input-line.js" data-combine></script>
  <script defer src="/js/voice-overlay.js" data-combine></script>
  <script defer src="/js/voice-input.js" data-combine></script>
  <script defer src="/js/word-translate.js" data-combine></script>
  <script defer src="/js/terminal-viewport.js" data-combine></script>
  <script defer src="/js/terminal-gestures.js" data-combine></script>
  <script defer src="/js/terminal-file-links.js" data-combine></script>
  <script defer src="/js/terminal-clipboard.js" data-combine></script>
  <script defer src="/js/open-link.js" data-combine></script>
  <script defer src="/js/oss-direct.js" data-combine></script>
  <script defer src="/js/agent-chat.js" data-combine></script>
  <script defer src="/js/mindmap.js" data-combine></script>
  <script defer src="/js/h5.js"></script>
</body>
</html>
