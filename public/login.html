<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <title>T-Agent · Authentication</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <!-- Added to the home screen the page opens as a full-screen app, like /h5 (auth.js switches the manifest to the phone one on a phone: start /h5, a computer starts at /); the manifest scope keeps the page after the login inside the app. -->
  <link rel="manifest" id="app-manifest" href="/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Tasks">
  <meta name="theme-color" content="#f6f8fa">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/css/auth.css">
  <script src="/js/i18n.js"></script>
  <script src="/js/i18n-zh-ui.js"></script>
  <script src="/js/auth.js" defer></script>
</head>
<body>
  <main class="auth-card" aria-labelledby="auth-title">
    <span class="brand">T-Agent</span>
    <h1 id="auth-title">Authentication</h1>
    <p id="auth-description">Checking binding status…</p>
    <div id="auth-content" aria-live="polite"></div>
    <p id="auth-error" role="alert" hidden></p>
    <p class="security-note">Web and mobile H5 share the same authenticator. Never share the binding key, codes or recovery codes.</p>
    <button type="button" class="secondary" data-lang-toggle data-lang-icon="🌐 " translate="no"></button>
  </main>
</body>
</html>
