<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#1e1e1e">
  <title>T-Agent</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <!-- The view the service worker (public/sw.js) shows for / and /h5 while this engine does not answer ("The page while its engine is down" in
       docs/design/failover-and-one-login.md). Self-contained like the login page: it needs nothing from the server it waits for. -->
  <link rel="stylesheet" href="/css/offline.css">
  <script src="/js/local-keys.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/i18n-zh-ui.js"></script>
  <script src="/js/offline.js" defer></script>
</head>
<body>
  <header class="offline-bar"><span class="offline-brand" translate="no">T-Agent</span></header>
  <main class="offline-main" id="offline-view" aria-live="polite">
    <svg class="offline-icon" viewBox="0 0 1024 1024" width="48" height="48" aria-hidden="true" focusable="false"><path fill="currentColor" d="M464 720a48 48 0 1096 0 48 48 0 10-96 0zm16-304v184c0 4.4 3.6 8 8 8h48c4.4 0 8-3.6 8-8V416c0-4.4-3.6-8-8-8h-48c-4.4 0-8 3.6-8 8zm475.7 440l-416-720c-6.2-10.7-16.9-16-27.7-16s-21.6 5.3-27.7 16l-416 720C56 877.4 71.4 904 96 904h832c24.6 0 40-26.6 27.7-48zm-783.5-27.9L512 239.9l339.8 588.2H172.2z"/></svg>
    <h1 class="offline-title" id="offline-title">This engine can't be reached</h1>
    <p class="offline-text" id="offline-text">Looking for your other devices…</p>
    <div class="offline-actions" id="offline-continue"></div>
    <button type="button" class="offline-text-button" id="offline-retry">Try again</button>
  </main>
</body>
</html>
