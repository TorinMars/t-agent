<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>注册 - Torin's Dashboard</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0d1117;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 48px 40px;
      width: 360px;
    }
    .logo { font-size: 24px; font-weight: 700; color: #c9d1d9; margin-bottom: 6px; text-align: center; }
    .subtitle { font-size: 13px; color: #8b949e; margin-bottom: 32px; text-align: center; }
    .form-group { margin-bottom: 14px; }
    label { display: block; font-size: 12px; color: #8b949e; margin-bottom: 5px; }
    input {
      width: 100%; padding: 9px 12px;
      background: #0d1117; border: 1px solid #30363d;
      border-radius: 6px; color: #c9d1d9; font-size: 14px;
      outline: none; transition: border-color 0.15s;
    }
    input:focus { border-color: #58a6ff; }
    .hint { font-size: 11px; color: #8b949e; margin-top: 4px; }
    .btn {
      width: 100%; padding: 10px; margin-top: 8px;
      background: #238636; border: none; border-radius: 6px;
      color: #fff; font-size: 14px; font-weight: 500;
      cursor: pointer; transition: background 0.15s;
    }
    .btn:hover { background: #2ea043; }
    .error-msg { font-size: 12px; color: #f85149; margin-top: 10px; text-align: center; min-height: 18px; }
    .login-link { text-align: center; margin-top: 20px; font-size: 13px; color: #8b949e; }
    .login-link a { color: #58a6ff; text-decoration: none; }
    .login-link a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">📋 Tasks</div>
    <div class="subtitle">创建账号</div>
    <div class="form-group">
      <label>用户名</label>
      <input type="text" id="username" autocomplete="username" placeholder="字母、数字、下划线，2-32位">
    </div>
    <div class="form-group">
      <label>密码</label>
      <input type="password" id="password" autocomplete="new-password" placeholder="至少6位">
    </div>
    <div class="form-group">
      <label>工作目录 <span style="color:#8b949e;font-weight:400">（新建任务时存放 md 文件的根目录）</span></label>
      <input type="text" id="work_dir" placeholder="例如 /Users/yourname/tasks（不填则用默认目录）">
      <div class="hint">目录不存在会自动创建</div>
    </div>
    <button class="btn" id="btn-register">注册</button>
    <div class="error-msg" id="error-msg"></div>
    <div class="login-link">已有账号？<a href="/login.html">登录</a></div>
  </div>
  <script>
    async function doRegister() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const work_dir = document.getElementById('work_dir').value.trim() || null;
      const errEl = document.getElementById('error-msg');
      errEl.textContent = '';

      if (!username || !password) { errEl.textContent = '用户名和密码不能为空'; return; }

      try {
        const res = await fetch('/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password, work_dir }),
        });
        if (res.ok) {
          location.href = '/';
        } else {
          const data = await res.json().catch(() => ({}));
          errEl.textContent = data.error || '注册失败';
        }
      } catch (e) {
        errEl.textContent = '网络错误，请重试';
      }
    }

    document.getElementById('btn-register').addEventListener('click', doRegister);
    document.getElementById('work_dir').addEventListener('keydown', e => { if (e.key === 'Enter') doRegister(); });
  </script>
</body>
</html>
