<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kwai URL parser</title>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #1a1d27;
      border-bottom: 1px solid #2d3748;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    header h1 {
      font-size: 18px;
      font-weight: 600;
      color: #f7fafc;
      letter-spacing: 0.5px;
      flex-shrink: 0;
    }

    .share-link {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #2d3748;
      border: 1px solid #4a5568;
      border-radius: 8px;
      padding: 5px 5px 5px 12px;
      cursor: pointer;
      transition: border-color 0.2s;
      max-width: 480px;
    }

    .share-link:hover {
      border-color: #667eea;
    }

    .share-link-url {
      font-size: 12px;
      font-family: 'SF Mono', 'Fira Code', monospace;
      color: #90cdf4;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
      min-width: 0;
    }

    .share-link-btn {
      flex-shrink: 0;
      background: #4a5568;
      border: none;
      border-radius: 5px;
      color: #a0aec0;
      padding: 4px 10px;
      font-size: 12px;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
      white-space: nowrap;
    }

    .share-link-btn:hover {
      background: #667eea;
      color: #fff;
    }

    .share-link-btn.copied {
      background: #276749;
      color: #68d391;
    }

    .url-bar {
      background: #1a1d27;
      border-bottom: 1px solid #2d3748;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .url-bar label {
      font-size: 13px;
      color: #a0aec0;
      white-space: nowrap;
      font-weight: 500;
    }

    .url-bar input {
      flex: 1;
      background: #2d3748;
      border: 1px solid #4a5568;
      border-radius: 8px;
      padding: 8px 14px;
      color: #e2e8f0;
      font-size: 13px;
      font-family: 'SF Mono', 'Fira Code', monospace;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .url-bar input:focus {
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
    }

    .url-bar input.error {
      border-color: #fc8181;
      box-shadow: 0 0 0 3px rgba(252, 129, 129, 0.15);
    }

    .clear-btn {
      background: #4a5568;
      border: none;
      border-radius: 6px;
      color: #a0aec0;
      padding: 7px 12px;
      cursor: pointer;
      font-size: 13px;
      transition: background 0.2s, color 0.2s;
      white-space: nowrap;
    }

    .clear-btn:hover {
      background: #718096;
      color: #f7fafc;
    }

    .main {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 0;
      min-height: 0;
    }

    /* ---- QR Code Panel ---- */
    .qr-panel {
      background: #1a1d27;
      border-right: 1px solid #2d3748;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
      gap: 20px;
    }

    .panel-title {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #718096;
    }

    #qrcode {
      background: #fff;
      border-radius: 12px;
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 200px;
      min-height: 200px;
    }

    #qrcode canvas,
    #qrcode img {
      display: block;
    }

    .qr-placeholder {
      color: #4a5568;
      font-size: 13px;
      text-align: center;
      line-height: 1.6;
    }

    .qr-hint {
      font-size: 11px;
      color: #4a5568;
      text-align: center;
      max-width: 200px;
      line-height: 1.5;
      word-break: break-all;
    }

    /* ---- JSON Panel ---- */
    .json-panel {
      background: #13151f;
      display: flex;
      flex-direction: column;
      padding: 24px;
      gap: 12px;
    }

    .json-panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .copy-btn {
      background: #2d3748;
      border: 1px solid #4a5568;
      border-radius: 6px;
      color: #a0aec0;
      padding: 5px 12px;
      cursor: pointer;
      font-size: 12px;
      transition: all 0.2s;
    }

    .copy-btn:hover {
      background: #4a5568;
      color: #f7fafc;
    }

    .copy-btn.copied {
      border-color: #68d391;
      color: #68d391;
    }

    #json-editor {
      flex: 1;
      background: #1a1d27;
      border: 1px solid #2d3748;
      border-radius: 10px;
      padding: 16px;
      color: #e2e8f0;
      font-size: 13px;
      font-family: 'SF Mono', 'Fira Code', 'Courier New', monospace;
      line-height: 1.7;
      resize: none;
      outline: none;
      min-height: 400px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    #json-editor:focus {
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
    }

    #json-editor.error {
      border-color: #fc8181;
      box-shadow: 0 0 0 3px rgba(252, 129, 129, 0.15);
    }

    .status-bar {
      background: #1a1d27;
      border-top: 1px solid #2d3748;
      padding: 6px 24px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #68d391;
      flex-shrink: 0;
    }

    .status-dot.error {
      background: #fc8181;
    }

    .status-text {
      color: #718096;
    }

    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: #4a5568;
      border-radius: 3px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #718096;
    }
  </style>
  <script src="/js/i18n.js"></script>
  <script src="/js/i18n-zh-ui.js"></script>
</head>
<body>

<header>
  <h1>🔗 Kwai URL parser</h1>
  <div class="share-link" id="share-link" title="Click to copy the LAN link">
    <span class="share-link-url" id="share-link-url">Loading...</span>
    <button class="share-link-btn" id="share-link-btn">Copy link</button>
  </div>
</header>

<div class="url-bar">
  <label>Deep link:</label>
  <input
    type="text"
    id="url-input"
    placeholder="Enter a kwai:// deep link, e.g. kwai://chat/session?sessionId=123&extraInfo=..."
    autocomplete="off"
    spellcheck="false"
  />
  <button class="clear-btn" id="clear-btn">Clear</button>
</div>

<div class="main">
  <!-- Left: QR Code -->
  <div class="qr-panel">
    <div class="panel-title">QR code</div>
    <div id="qrcode">
      <div class="qr-placeholder">Enter a deep link above<br>to generate one</div>
    </div>
    <div class="qr-hint" id="qr-hint"></div>
  </div>

  <!-- Right: JSON -->
  <div class="json-panel">
    <div class="json-panel-header">
      <div class="panel-title">Parsed result (JSON)</div>
      <button class="copy-btn" id="copy-btn">Copy JSON</button>
    </div>
    <textarea
      id="json-editor"
      placeholder="The parsed result appears here; you can also edit the JSON directly to sync back to the deep link..."
      spellcheck="false"
    ></textarea>
  </div>
</div>

<div class="status-bar">
  <div class="status-dot" id="status-dot"></div>
  <div class="status-text" id="status-text">Ready</div>
</div>

<script>
  // ─── Share link ───────────────────────────────────────────
  (async () => {
    const urlEl = document.getElementById('share-link-url');
    const btn   = document.getElementById('share-link-btn');
    const wrap  = document.getElementById('share-link');

    let shareUrl = window.location.href;

    try {
      const res  = await fetch('/api/local-ip');
      const data = await res.json();
      const url  = new URL(window.location.href);
      url.hostname = data.ip;
      url.port     = data.port;
      shareUrl = url.toString();
    } catch {}

    urlEl.textContent = shareUrl;
    wrap.title = shareUrl;

    const copy = () => {
      navigator.clipboard.writeText(shareUrl).then(() => {
        btn.textContent = 'Copied ✓';
        btn.classList.add('copied');
        setTimeout(() => {
          btn.textContent = 'Copy link';
          btn.classList.remove('copied');
        }, 1800);
      });
    };

    btn.addEventListener('click', (e) => { e.stopPropagation(); copy(); });
    wrap.addEventListener('click', copy);
  })();

  // ─── State ───────────────────────────────────────────────
  let _updating = false; // guard to prevent re-entrant updates
  let qrInstance = null;

  const urlInput   = document.getElementById('url-input');
  const jsonEditor = document.getElementById('json-editor');
  const qrDiv      = document.getElementById('qrcode');
  const qrHint     = document.getElementById('qr-hint');
  const clearBtn   = document.getElementById('clear-btn');
  const copyBtn    = document.getElementById('copy-btn');
  const statusDot  = document.getElementById('status-dot');
  const statusText = document.getElementById('status-text');

  // ─── URL → JSON ──────────────────────────────────────────
  function parseUrl(raw) {
    raw = raw.trim();
    if (!raw) return null;

    try {
      // Ensure it has a double-slash for URL() parsing even for custom schemes
      const normalized = raw.replace(/^([a-zA-Z][a-zA-Z0-9+\-.]*):\/\//, (m, s) => `${s}://`);
      // Use a dummy http URL so the URL API can parse it
      const placeholder = raw.replace(/^([a-zA-Z][a-zA-Z0-9+\-.]*):/, 'http:');
      const u = new URL(placeholder);

      const scheme = raw.match(/^([a-zA-Z][a-zA-Z0-9+\-.]*:)/)?.[1] ?? '';
      const host   = u.hostname;
      const path   = u.pathname;

      const params = {};
      u.searchParams.forEach((val, key) => {
        // Try to parse as JSON first (handles objects & arrays)
        try {
          params[key] = JSON.parse(val);
        } catch {
          // Try number
          const num = Number(val);
          if (!isNaN(num) && val !== '') {
            params[key] = num;
          } else {
            params[key] = val;
          }
        }
      });

      return { scheme, host, path, parameters: params };
    } catch (e) {
      return null;
    }
  }

  // ─── JSON → URL ──────────────────────────────────────────
  function buildUrl(obj) {
    try {
      const { scheme, host, path, parameters } = obj;
      if (!scheme || !host) return null;

      let url = `${scheme}//${host}${path || ''}`;

      const entries = Object.entries(parameters || {});
      if (entries.length > 0) {
        const qp = entries.map(([k, v]) => {
          const encoded = (typeof v === 'object' && v !== null)
            ? encodeURIComponent(JSON.stringify(v))
            : encodeURIComponent(String(v));
          return `${encodeURIComponent(k)}=${encoded}`;
        });
        url += '?' + qp.join('&');
      }

      return url;
    } catch {
      return null;
    }
  }

  // ─── QR Code ─────────────────────────────────────────────
  function renderQR(text) {
    qrDiv.innerHTML = '';
    qrHint.textContent = '';

    if (!text) {
      qrDiv.innerHTML = '<div class="qr-placeholder">Enter a deep link above<br>to generate one</div>';
      return;
    }

    try {
      qrInstance = new QRCode(qrDiv, {
        text: text,
        width: 200,
        height: 200,
        colorDark: '#000000',
        colorLight: '#ffffff',
        correctLevel: QRCode.CorrectLevel.M,
      });
      qrHint.textContent = text.length > 60 ? text.slice(0, 60) + '…' : text;
    } catch (e) {
      qrDiv.innerHTML = '<div class="qr-placeholder" style="color:#fc8181">QR code generation failed</div>';
    }
  }

  // ─── Status Bar ──────────────────────────────────────────
  function setStatus(ok, msg) {
    statusDot.className = 'status-dot' + (ok ? '' : ' error');
    statusText.textContent = msg;
  }

  // ─── URL input → sync JSON + QR ──────────────────────────
  function onUrlChange() {
    if (_updating) return;
    _updating = true;

    const raw = urlInput.value.trim();

    urlInput.classList.remove('error');
    jsonEditor.classList.remove('error');

    if (!raw) {
      jsonEditor.value = '';
      renderQR('');
      setStatus(true, 'Ready');
      _updating = false;
      return;
    }

    const parsed = parseUrl(raw);
    if (!parsed) {
      urlInput.classList.add('error');
      setStatus(false, 'Invalid deep link format; cannot parse');
      _updating = false;
      return;
    }

    jsonEditor.value = JSON.stringify(parsed, null, 2);
    renderQR(raw);
    setStatus(true, 'Parsed successfully');

    _updating = false;
  }

  // ─── JSON editor → sync URL + QR ─────────────────────────
  function onJsonChange() {
    if (_updating) return;
    _updating = true;

    const raw = jsonEditor.value.trim();

    urlInput.classList.remove('error');
    jsonEditor.classList.remove('error');

    if (!raw) {
      urlInput.value = '';
      renderQR('');
      setStatus(true, 'Ready');
      _updating = false;
      return;
    }

    let obj;
    try {
      obj = JSON.parse(raw);
    } catch {
      jsonEditor.classList.add('error');
      setStatus(false, 'Invalid JSON; cannot sync');
      _updating = false;
      return;
    }

    const url = buildUrl(obj);
    if (!url) {
      jsonEditor.classList.add('error');
      setStatus(false, 'The JSON is missing required fields (scheme / host)');
      _updating = false;
      return;
    }

    urlInput.value = url;
    renderQR(url);
    setStatus(true, 'Deep link regenerated from the JSON');

    _updating = false;
  }

  // ─── Copy JSON ───────────────────────────────────────────
  copyBtn.addEventListener('click', () => {
    const text = jsonEditor.value;
    if (!text) return;
    navigator.clipboard.writeText(text).then(() => {
      copyBtn.textContent = 'Copied ✓';
      copyBtn.classList.add('copied');
      setTimeout(() => {
        copyBtn.textContent = 'Copy JSON';
        copyBtn.classList.remove('copied');
      }, 1800);
    });
  });

  // ─── Clear ───────────────────────────────────────────────
  clearBtn.addEventListener('click', () => {
    urlInput.value = '';
    jsonEditor.value = '';
    urlInput.classList.remove('error');
    jsonEditor.classList.remove('error');
    renderQR('');
    setStatus(true, 'Cleared');
  });

  // ─── Event Listeners ─────────────────────────────────────
  urlInput.addEventListener('input', onUrlChange);
  jsonEditor.addEventListener('input', onJsonChange);

  // ─── Init with example ───────────────────────────────────
  urlInput.value = 'kwai://chat/session?sessionId=2198523224&extraInfo=%7B%22adCallback%22%3A%22Co3fRsoAdL4NA-NGwCIZwgQQ0DlY6fK15syTeHdgSYc%22%2C%22pageId%22%3A%22782602130931420332%22%2C%22pageFrom%22%3A15%2C%22adPageUrl%22%3A%22https%3A%2F%2Fmoli.kuaishou.com%2Fpc-preview%3FhyId%3DlandingPg%26pageId%3D782602130931420332%22%7D&pageStyle=2';
  onUrlChange();
</script>
</body>
</html>
